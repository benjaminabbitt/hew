title: Your first patch
description: The README's server/timeout change, applied — a patch that reads like a diff and addresses a node.
order: 1
show:
  - config.yaml
  - timeout.hew
intro: |
  This is the patch from the front page, run for real. A `.hew` file reads the way a
  unified diff reads — `-` for what goes, `+` for what arrives, unmarked lines for the
  surroundings — but the surroundings are not lines. The `@@ /server @@` header
  is an address into the document's shape, and the `host` line above the margins is
  a *context node*: hew looks for a `host` key whose value is `api.example.com` in
  that mapping, and refuses if it does not find one.

  Nothing in the patch mentions a line number, and nothing in it will.
steps:
  - title: Apply it in place
    note: |
      `-i` writes the result back over the target. It is also the default when the patch
      names a target and no `-o` is given, so the flag here is documentation for the
      reader rather than a switch.
    run: [apply, -i, timeout.hew]
    expect_exit: 0
    watch: [config.yaml]
    caption: |
      The `timeout` value moved. Everything else — the two-space indentation, the key
      order, the `host` line hew asserted on the way past — is the same bytes it was.

  - title: Apply it a second time
    note: |
      `patch(1)` would notice the change is already present and, depending on its mood,
      either reverse it or write a `.rej` file. hew does neither. An unannotated hunk is
      strict: the before-image is gone, so the patch does not apply, and it says which
      node and which patch line made the claim it could not honor.
    run: [apply, -i, timeout.hew]
    expect_exit: 1
    unchanged: [config.yaml]
    caption: |
      Exit 1 in hew means one specific thing: **the patch did not apply and nothing was
      written**. There is no partial application to clean up and no reject file to find.
outro: |
  ## What to take from this

  - The patch mirrors the document, so the change is legible without executing it in your head.
  - Context lines are assertions. They cost nothing to read and they are the reason a
    misapplication is impossible rather than unlikely.
  - Re-applying is a failure, loudly, by default. If you want convergence you ask for it
    in the patch text with `! idempotent`, where a reviewer can see it.
