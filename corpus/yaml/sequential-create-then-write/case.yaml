name: yaml/sequential-create-then-write
seams: [e2e]
kind: ok
format: yaml
ops: [OP-04, OP-03]
why: |
  SEQUENTIAL RESOLUTION (§9.2, §9.3): the second hunk writes into
  "/mcpServers", a container the FIRST hunk creates (`! default` over an
  absent top-level key, OP-04, the same shape yaml/default-key-absent-root
  pins alone). The second hunk must resolve against the document as the
  first hunk left it, not against the original pre-image, where
  "/mcpServers" does not exist — and specifically against an EMPTY FLOW
  collection ("mcpServers: {}") the first hunk just wrote, which this
  binding can only expand once it is real (§8.3's flow-collection rule).
spec: "§9.2, §9.3, §11 OP-04, OP-03"
