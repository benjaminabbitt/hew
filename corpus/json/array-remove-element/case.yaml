name: json/array-remove-element
seams: [parse, apply-ir, e2e]
kind: ok
format: json
ops: [OP-14, OP-15]
why: |
  A `-` element in a scalar sequence, and the reorder-survival claim made with bytes
  that actually exercise it. The parser addresses every listed element by value
  (`/tags/=beta`), not by index (§4.2), so the fixture deliberately shuffles the
  target away from the order the hunk is written in: the hunk reads `alpha`, `beta`,
  `gamma` at what would be indices 0, 1, 2, and the target holds them at 1, 3 and 4
  with an unlisted `delta` ahead of all three and an unlisted `epsilon` interleaved
  between `alpha` and `beta`. Every listed element has moved, and the patch still
  applies — that is §6.4.2's identity addressing.

  The shuffle stops exactly where §6.1 does. A sequence matches as an ORDERED
  subsequence, so the listed elements keep their listed relative order while the
  unlisted ones are free to sit before, between, or after them; a target that put
  `gamma` ahead of `alpha` would be a different assertion (§6.1) and is not what this
  case claims. The expected bytes also pin that removal takes the named element and
  nothing else: `delta`, `alpha` and `epsilon` survive in their original positions.
spec: "§4.2, §6.1, §6.4.2, §11 OP-15"
