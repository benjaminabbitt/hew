name: json/sequential-create-then-write
seams: [e2e]
kind: ok
format: json
ops: [OP-04, OP-03]
why: |
  SEQUENTIAL RESOLUTION (§9.2, §9.3): the second hunk writes into
  "/mcpServers", a container the FIRST hunk creates (`! default` over an
  absent top-level key, OP-04). The second hunk must resolve against the
  document as the first hunk left it, not against the original pre-image,
  where "/mcpServers" does not exist — this is the motivating case for
  sequential resolution: a caller writing "create the container if absent,
  then upsert an entry into it" as two hunks/ops, the shape every consumer
  used to hand-roll a branch to avoid.
spec: "§9.2, §9.3, §11 OP-04, OP-03"
