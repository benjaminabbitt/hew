name: hcl/two-label-roundtrip
seams: [diff, render, parse, apply-ir, e2e]
kind: ok
format: hcl
ops: [OP-01]
why: |
  RT1 for the two-label tuple. The differ's projection groups blocks by type FIRST
  and then splits on each label in turn (§4.3), so the anchor it must emit for
  `resource "aws_s3_bucket" "assets"` is the full three-segment address — a differ
  that stopped at `/resource` or `/resource/"aws_s3_bucket"` would emit an anchor the
  applier is required to refuse as HEW012, which is exactly what hcl/two-label-
  ambiguous pins. Both same-type blocks change, so the patch carries two anchors that
  agree on every segment but the last and must still round-trip byte for byte.

  Ruling O39: the `--- ` line names the OLD side. The patch applies to old — which is
  what this case's apply-ir and e2e seams do with it — so naming new.tf would name a
  file the applier never opens.
spec: "§4.3, §9.4, §13.5"
