name: hcl/block-key-match
seams: [parse, apply-ir, e2e]
kind: ok
format: hcl
ops: [OP-01]
why: |
  RULED O45. §6.4.3 rule 1 says an ordinal is the LAST resort and recommends
  addressing a repeated block by a distinguishing attribute instead — but §4.2
  restricted key-match to sequences, so the spec was recommending a remedy it
  gave no spelling for. A set of blocks sharing a `(type, labels)` tuple is an
  addressable container for key-match now, matched on a direct attribute:
  `/resource/"aws_s3_bucket"/bucket="example-assets"`.

  The fixture is hcl/two-label-ambiguous's, one label short on purpose. That
  address — `/resource/"aws_s3_bucket"` — names both blocks and is HEW012, and
  the ordinal was the only thing that could pick between them. Here the same
  partial address plus one attribute picks the second block by IDENTITY, and no
  ordinal appears anywhere: the path is still a statement about which node is
  meant and never about where it sits, which is what §4.3 says an ordinal is an
  admission of.

  The expected bytes catch the two ways of getting this wrong. The addressed
  block is the SECOND of the two, so a binding that took the first match would
  rewrite `logs`; and both blocks carry the same `acl = "private"`, so a binding
  that applied to every block of the tuple would rewrite both.
spec: "§4.2, §6.4.3, §8.5, §11 OP-01"
