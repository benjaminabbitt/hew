name: hcl/two-label-ambiguous
seams: [e2e]
kind: error
format: hcl
error: HEW012
error_seam: apply-ir
error_path: /resource/"aws_s3_bucket"
patch_line: 5
message_contains:
  - "ambiguous-match"
  - '2 blocks match resource "aws_s3_bucket"'
  - "will not pick one"
ops: [OP-37]
why: |
  §4.3's tuple rule read from the other end: a PARTIAL label list is not an address.
  `/resource/"aws_s3_bucket"` stops one label short of the `(type, labels)` tuple, so
  it names both `resource "aws_s3_bucket" "assets"` and `resource "aws_s3_bucket"
  "logs"` — and §8.5 requires HEW012 rather than a first-match guess. The sibling of
  hcl/two-label-edit: the same file, one label fewer, and the difference between an
  edit and a refusal. The pinned message states the count and the refusal ("2 blocks
  match", "will not pick one") so the reviewer is told what to add rather than only
  that something was wrong; the pinned line is the `@@` header, because the address
  to fix is written there and not on the body line that first asked for it (§10.3).
spec: "§4.3, §8.5, §10.3, §11 OP-37"
