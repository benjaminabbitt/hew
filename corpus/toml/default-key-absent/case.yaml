ops: [OP-04]
why: |
  `! default` on a TOP-LEVEL key whose immediate parent is the document root
  (always present): absent here, so it is created. Same shape as
  json/default-key-absent and jsonc/default-key-absent, pinned separately
  because ext/toml carries its own planInsert (§8.4).
