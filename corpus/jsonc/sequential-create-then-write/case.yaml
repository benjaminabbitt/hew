name: jsonc/sequential-create-then-write
seams: [e2e]
kind: ok
format: jsonc
ops: [OP-04, OP-03]
why: |
  SEQUENTIAL RESOLUTION (§9.2, §9.3): the second hunk writes into
  "/mcpServers", a container the FIRST hunk creates (`! default` over an
  absent top-level key, OP-04), with a leading comment preserved ahead of it.
  The second hunk must resolve against the document as the first hunk left
  it, not against the original pre-image, where "/mcpServers" does not
  exist. jsonc's own Apply already reparsed before each MUTATION prior to
  this ruling (a fix for its comment-anchored placement chaining), so this
  case also guards that this binding does not regress once `test` joins the
  same per-transform sequencing.
spec: "§9.2, §9.3, §11 OP-04, OP-03"
