agents:
    default:
        llm: claude-code
        profiles:
            - default
        runtime: host
config:
    use_distilled: true
default_agent: default
dirty_tree_handler: commit
llm:
    configs:
        claude-code:
            type: claude-code
            model: claude-opus-4-8
        claude-fast:
            type: claude-code
            model: claude-haiku-4-5-20251001
    defaults:
        primary: claude-code
        fast: claude-fast
version: 6
