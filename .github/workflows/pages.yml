name: pages

# Builds and publishes the project site to GitHub Pages.
#
# The example transcripts are COMPUTED here, not checked in: `just examples`
# builds the hew binary from this commit and runs it against the scenarios in
# examples/, and only then does astro build. A transcript can therefore never
# document behavior the binary at this commit does not have — the failure mode
# of committing generated docs is unavailable by construction.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'examples/**'
      - 'go/**'
      - 'README.md'
      - 'justfile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a superseded build has nothing to say.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: extractions/setup-just@v2

      # Build hew, run every scenario, render the transcripts. The generator
      # fails if a step's real exit code disagrees with its scenario, so this
      # step is also a smoke test of the CLI contract.
      - name: Generate example transcripts
        run: just examples

      # Determinism gate: a second generation must produce identical bytes.
      # If it does not, something non-reproducible (a clock, a map iteration,
      # a temp path) has reached a page.
      - name: Transcripts are deterministic
        run: just examples-check

      - name: Install website dependencies
        run: just site-deps

      - name: Build website
        run: cd website && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
